server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/javascript application/javascript text/plain;

    # three.module.js allein ist gut 1 MB — ohne gzip ist der erste Aufruf zäh.
    # nginx liefert .js je nach Version als text/javascript ODER
    # application/javascript aus, deshalb stehen beide hier.
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /vendor/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
